# ---------------------------------------------------------------------------
# personal-blog-frontend — servidor de archivos estaticos del entorno LOCAL
#
# Solo para el contenedor de `Task/007`. En produccion no existe: Cloudflare
# Pages sirve el mismo `dist/` sin servidor propio (`Task/034`).
#
# Nginx NO enruta hacia el backend ni hace de reverse proxy: ese papel es de
# Traefik v3, unico proxy del entorno (D-05). Aqui solo se sirven archivos y se
# resuelve el *fallback* de la SPA.
# ---------------------------------------------------------------------------

server {
    # 8080 y no 80: evita depender de un puerto privilegiado dentro del
    # contenedor. Nada mas.
    #
    # NO significa que el proceso corra sin privilegios: la imagen oficial de
    # nginx arranca su proceso maestro como root y solo baja de usuario en los
    # workers. Elegir un puerto alto no cambia eso.
    #
    # El endurecimiento real de las imagenes —usuario no privilegiado,
    # capacidades, sistema de archivos de solo lectura— es `Task/018`, y no se
    # adelanta aqui.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la version del servidor.
    server_tokens off;

    # -----------------------------------------------------------------------
    # Fallback de la SPA.
    #
    # El enrutado del sitio ocurre en el navegador (`react-router`). Una
    # peticion directa a /cualquier-ruta debe devolver `index.html` para que el
    # router la resuelva —incluida la pagina 404 de `Task/006`—. Sin esto, una
    # recarga en cualquier ruta distinta de `/` responderia 404 del servidor.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `index.html` nunca se cachea: es quien referencia los bundles con hash y
    # una copia vieja dejaria la aplicacion apuntando a archivos inexistentes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Los activos generados por Vite llevan hash en el nombre: cambiar el
    # contenido cambia la URL, asi que pueden cachearse de forma agresiva.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
