# Servidor estatico LOCAL; Traefik conserva el papel de unico reverse proxy.
# request_uri conserva la ruta original incluso tras el fallback a index.html.
# Se contemplan mayusculas y escapes equivalentes al segmento admin.
map $request_uri $security_robots {
    default "";
    ~*^/(a|%61)(d|%64)(m|%6d)(i|%69)(n|%6e)(/|%2f|\?|$) "noindex, nofollow";
}
map $security_robots $security_cache {
    default "no-store";
    "" $public_cache;
}
map $uri $public_cache {
    default "no-cache, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/security-headers.conf;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        try_files $uri =404;
    }
}
