# El proceso maestro y los workers arrancan como nginx (UID 101), sin root.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # No se registran query, cookies, Authorization ni URLs firmadas.
    log_format seguro escape=json '{"method":"$request_method","status":$status,"duration_s":$request_time}';
    access_log /dev/stdout seguro;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;
    include /etc/nginx/conf.d/*.conf;
}
