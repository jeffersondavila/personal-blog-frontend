<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Favicon neutro provisional (`Task/014`, decision D-014-E): una marca
      geometrica simple con los colores de los tokens del sistema de diseno,
      sin logotipo ni iniciales. Se reemplaza cuando exista identidad visual.
      Vite copia `public/` tal cual al build, asi que la ruta es absoluta.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Blog personal</title>

    <!--
      Metadatos de Open Graph que NO dependen de la pagina (`Task/016`, E-03).

      Viven aqui, y no en el componente `Seo`, por una razon medida: React 19 iza
      los metadatos al `head` pero **no deduplica**. Se comprobo que una etiqueta
      estatica y otra dinamica con el mismo `name`/`property` coexisten, asi que
      declarar aqui algo que `Seo` tambien emite produciria duplicados
      contradictorios en toda pagina.

      El reparto es por tanto exacto:

        - Aqui, lo que vale para TODO el sitio: la imagen, el nombre y el tipo de
          tarjeta. Un *crawler* que no ejecuta JavaScript recibe al menos esto, y
          es informacion CORRECTA para cualquier URL.
        - En `Seo`, lo que cambia por pagina: `og:title`, `og:description`,
          `og:url`, `og:type` y `description`.

      El origen de `og:image` lo sustituye Vite en el build a partir de la
      variable del sitio: la etiqueta exige una URL absoluta, y el origen es
      configuracion, no una constante (D-07 sigue abierta).

      La imagen es un activo ESTATICO del propio sitio (decision D-016-A): no
      caduca y no exige autenticacion. Nunca un `access_url`, que caduca en 900 s
      — regla vigente de D-08.
    -->
    <meta property="og:site_name" content="Blog personal" />
    <meta property="og:image" content="%VITE_SITE_BASE_URL%/og-imagen.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Marca de Blog personal" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
